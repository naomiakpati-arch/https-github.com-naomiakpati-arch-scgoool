<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clouds</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      position: relative;
      background:
        linear-gradient(
          to bottom,
          #b8c8d9 0%,
          #d8bbc1 18%,
          #d67d60 44%,
          #d56d59 58%,
          #6e7c8b 100%
        );
    }

    .haze {
      position: absolute;
      top: 12%;
      left: 0;
      width: 100%;
      height: 24%;
      background: linear-gradient(
        to bottom,
        rgba(255, 193, 168, 0.75),
        rgba(255, 193, 168, 0)
      );
      filter: blur(26px);
      z-index: 1;
    }

    .page-header {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      height: auto;
      pointer-events: none;
      text-align: center;
      padding-top: 42px;
    }

    .page-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.3rem, 6vw, 4.3rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 219, 151, 0.95);
      text-shadow: 0 0 18px rgba(255, 255, 255, 0.12);
      margin-bottom: 18px;
    }

    .content-body {
      position: relative;
      z-index: 3;
      width: min(1000px, 90vw);
      margin: 0 auto;
      padding: 16px 20px 56px;
      text-align: center;
    }

    .subtitle {
      display: block;
      margin-bottom: 12px;
      color: rgba(255, 232, 200, 0.85);
      font-size: 0.72rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
    }

    .main-title {
      margin-bottom: 20px;
      color: rgba(255, 219, 151, 0.96);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 5vw, 3.4rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .description {
      max-width: 820px;
      margin: 0 auto 24px;
      color: rgba(255, 246, 239, 0.9);
      font-size: clamp(1rem, 2vw, 1.4rem);
      line-height: 1.6;
      font-style: italic;
    }

    .cta-button {
      display: inline-block;
      padding: 13px 30px;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 241, 225, 0.88);
      color: #3a2d2a;
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: bold;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 8px 24px rgba(255, 255, 255, 0.15);
    }

    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(255, 255, 255, 0.22);
    }

    .choices {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 28px;
      flex-wrap: wrap;
    }

    .card {
      display: inline-block;
      padding: 14px 20px;
      border: 1px solid rgba(255, 226, 180, 0.7);
      border-radius: 12px;
      color: #fff5ea;
      text-decoration: none;
      background: rgba(92, 78, 76, 0.18);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      background: rgba(120, 98, 94, 0.25);
    }

    .cloud-group {
      position: absolute;
      bottom: -40px;
      left: 0;
      width: 100%;
      height: 58%;
      overflow: hidden;
      filter: blur(6px);
      z-index: 2;
      pointer-events: none;
    }

    .cloud-group::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 182, 146, 0.18);
      filter: blur(12px);
    }

    .p1, .p2, .p3, .p4 {
      position: absolute;
      border-radius: 50%;
      opacity: 0.95;
      box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.18);
    }

    .p1 {
      width: 520px;
      height: 420px;
      left: -80px;
      bottom: 0;
      background: rgba(245, 158, 120, 0.9);
    }

    .p2 {
      width: 500px;
      height: 360px;
      left: 180px;
      bottom: 50px;
      background: rgba(238, 171, 146, 0.82);
    }

    .p3 {
      width: 440px;
      height: 360px;
      right: 190px;
      bottom: 80px;
      background: rgba(234, 155, 128, 0.8);
    }

    .p4 {
      width: 560px;
      height: 420px;
      right: -40px;
      bottom: 0;
      background: rgba(228, 141, 110, 0.86);
    }
  </style>
</head>
<body>
  <div class="haze"></div>

  <header class="page-header">
    <h1 class="page-title">Clouds</h1>
  </header>

  <main class="content-body">
    <span class="subtitle">Cloud Sequence</span>
    <h2 class="main-title">The Dreaming Sky</h2>

    <p class="description">
      Pale light drifts across the horizon while the clouds gather like soft memories,
      carrying the day toward a warm and quiet sunset.
    </p>

    <a class="cta-button" href="#destinations">Follow the Drift</a>

    <nav class="choices" id="destinations" aria-label="Choose your next destination">
      <a href="forest.html" class="card">Follow the Light to the Forest</a>
      <a href="index.html" class="card">Return to the Dream</a>
    </nav>
  </main>

  <div class="cloud-group" aria-hidden="true">
    <div class="p1"></div>
    <div class="p2"></div>
    <div class="p3"></div>
    <div class="p4"></div>
  </div>
</body>
</html>
