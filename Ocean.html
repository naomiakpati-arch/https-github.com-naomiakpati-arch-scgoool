<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Ocean</title>
  <link rel="stylesheet" href="Styles.css" />
</head>
<body class="ocean-page">
  <header class="page-header">
    <h1>Welcome to the Ocean</h1>
  </header>

  <main class="content-body">
    <span class="subtitle">Ocean Sequence</span>
    <h2 class="main-title">The Deep Ocean</h2>

    <div class="hero-visual">
      <img
        class="hero-image"
        src="assets/img/ocean.jpg"
        alt="A serene ocean view"
      />
    </div>

    <p class="description">
      Vast waters stretch endlessly under the open sky. Sunlight dances on the waves,
      creating a mesmerizing play of light and shadow.
    </p>

    <button class="cta-button">Dive into the Ocean</button>

    <div class="choices">
      <a href="coral.html" class="card">Explore the Reefs</a>
      <a href="index.html" class="card">Return to Land</a>
    </div>
  </main>

  <style>
    body.ocean-page {
      background:
        radial-gradient(circle at 50% 20%, rgba(128, 177, 214, 0.22), transparent 28%),
        linear-gradient(to bottom, #0d1d2e 0%, #0f2d3d 30%, #091924 100%);
    }

    body.ocean-page::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url("ocean-bg.jpe") center center / cover no-repeat;
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
    }

    .hero-visual {
      position: relative;
      width: min(1000px, 100%);
      margin: 0 auto 30px;
      padding: 18px;
      border-radius: 26px;
      background:
        linear-gradient(rgba(4, 12, 20, 0.12), rgba(8, 18, 30, 0.2)),
        url("ocean-bg.jpe") center center / cover no-repeat;
      box-shadow: 0 18px 45px rgba(4, 9, 16, 0.34);
      border: 1px solid rgba(133, 163, 181, 0.32);
    }

    .hero-image {
      display: block;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      border-radius: 18px;
      box-shadow: 0 0 40px rgba(173, 214, 255, 0.12);
      border: 1px solid rgba(140, 177, 206, 0.25);
      position: relative;
      z-index: 1;
    }

    body.ocean-page > * {
      position: relative;
      z-index: 1;
    }
  </style>
</body>
</html>
